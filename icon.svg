<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256">
  <!-- Sub Terra II: the mountain of the title screen, its crater alight, a vein of
       lava running down its face. Bold shapes, so it still reads at 16 px. -->
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#120b09"/>
      <stop offset="1" stop-color="#6a2e14"/>
    </linearGradient>
    <linearGradient id="vein" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffd76a"/>
      <stop offset="0.45" stop-color="#f28a2e"/>
      <stop offset="1" stop-color="#9a2e12"/>
    </linearGradient>
    <radialGradient id="crater" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffe08a" stop-opacity="0.95"/>
      <stop offset="0.5" stop-color="#f28a2e" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#f28a2e" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4"/>
    </filter>
    <clipPath id="tile"><rect width="256" height="256" rx="40"/></clipPath>
  </defs>
  <g clip-path="url(#tile)">
    <rect width="256" height="256" fill="url(#sky)"/>
    <!-- The far ridge. -->
    <path d="M-10 196 L52 140 L88 162 L132 118 L176 150 L210 128 L266 176 L266 266 L-10 266 Z" fill="#2a170f"/>
    <!-- The mountain, its crater cut flat. -->
    <path d="M28 256 L106 86 L150 86 L228 256 Z" fill="#140c08"/>
    <!-- The heat above the crater. -->
    <ellipse cx="128" cy="84" rx="44" ry="26" fill="url(#crater)"/>
    <!-- The vein of lava, glowing, then drawn sharp over its own glow. -->
    <path d="M118 88 L138 88 L144 132 L132 162 L150 210 L140 256 L112 256 L124 208 L108 164 L124 128 Z"
          fill="#f28a2e" filter="url(#glow)" opacity="0.8"/>
    <path d="M120 88 L136 88 L140 132 L128 162 L144 210 L134 256 L118 256 L128 208 L113 164 L127 128 Z"
          fill="url(#vein)"/>
    <!-- Embers thrown up. -->
    <circle cx="96" cy="58" r="3.5" fill="#f7c045"/>
    <circle cx="158" cy="46" r="3" fill="#f28a2e"/>
    <circle cx="140" cy="30" r="2.5" fill="#f7c045"/>
    <circle cx="112" cy="36" r="2" fill="#f28a2e"/>
  </g>
</svg>
